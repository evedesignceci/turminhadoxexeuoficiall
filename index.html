<!-- PÁGINA 3: JOGOS COM SISTEMA DE PROGRESSÃO 0 A 1000 -->
<div id="pagina-jogos" class="page-content">
  <div class="age-group-section">
    <div class="age-title">🎮 Aventura da Turminha: Fase <span id="fase-atual-txt">1</span> / 1000</div>
    
    <!-- Barra de Progresso -->
    <div style="width: 100%; background: #E2E8F0; height: 12px; border-radius: 10px; margin-bottom: 20px;">
        <div id="progresso-bar" style="width: 0.1%; height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.5s;"></div>
    </div>

    <div class="interactive-card" id="area-jogo-ativo">
        <h4 id="fase-titulo" style="font-weight: 900; font-size: 16px; color: var(--primary-dark);">Carregando Aventura...</h4>
        <p id="fase-descricao" style="font-size: 13px; color: var(--text-muted); margin: 10px 0;"></p>
        
        <div id="game-canvas-area" style="min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
            <!-- Elementos do jogo gerados aqui -->
        </div>

        <button onclick="avancarFase()" id="btn-avancar" style="background: var(--green); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 15px;">
            Completar Fase e Avançar ➔
        </button>
    </div>
  </div>
</div>

<script>
    let faseID = 0; // De 0 a 1000

    function atualizarFase() {
        const progresso = (faseID / 1000) * 100;
        document.getElementById('fase-atual-txt').innerText = faseID;
        document.getElementById('progresso-bar').style.width = progresso + "%";

        // Lógica de Personagem Guia por intervalo
        let guia = "";
        if (faseID <= 150) guia = "Xexéu";
        else if (faseID <= 300) guia = "Capilé";
        else if (faseID <= 450) guia = "Joca";
        else if (faseID <= 600) guia = "Iza";
        else if (faseID <= 750) guia = "Nina";
        else if (faseID <= 900) guia = "Hilda";
        else guia = "Vovô Beto";

        document.getElementById('fase-titulo').innerText = "Missão com " + guia;
        document.getElementById('fase-descricao').innerText = `Fase ${faseID}: Ajude o ${guia} a resolver este desafio exclusivo da Turminha!`;
        
        // Aqui você pode inserir dinamicamente elementos de jogo
        lerTexto(`Fase ${faseID}, vamos lá!`);
    }

    function avancarFase() {
        if (faseID < 1000) {
            faseID++;
            atualizarFase();
        } else {
            alert("Parabéns! Você completou as 1000 fases da Turminha!");
        }
    }

    // Iniciar
    atualizarFase();
</script>
