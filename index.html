<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turminha do Xexéu - Portal Oficial</title>
  
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cinzel:wght@700;900&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #3B82F6;
      --primary-dark: #1D4ED8;
      --secondary: #F59E0B;
      --accent: #EF4444;
      --purple: #8B5CF6;
      --green: #10B981;
      --tea-blue: #0284C7;
      --tea-light: #F0F9FF;
      --bg-gradient: linear-gradient(180deg, #E0F2FE 0%, #FAF5FF 60%, #FFF1F2 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background: var(--bg-gradient); color: #0F172A; min-height: 100vh; padding: 10px; display: flex; justify-content: center; }
    
    .app-container { width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    /* Correção Layout Mobile */
    .section-family-container, .video-section, .support-form-box, .page-nav { width: 100%; }
    .banner-intro-grid { display: flex; flex-direction: column; width: 100%; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logo-img { max-width: 120px; }
    
    .page-content { display: none; width: 100%; }
    .page-content.active-page { display: block; }

    .btn-vip-checkout { background: var(--secondary); color: #FFF; padding: 12px; border-radius: 12px; border: none; width: 100%; font-weight: 800; cursor: pointer; }
    
    .certificado-moldura { background: #FFFDF7; border: 4px double #D97706; padding: 20px; text-align: center; margin-top: 20px; }
    .certificado-nome-destaque { font-size: 24px; font-weight: 900; color: var(--primary-dark); border-bottom: 2px solid var(--secondary); margin: 10px 0; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <img src="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png" alt="Logo" class="logo-img">
      <button onclick="mudarPagina('config')">⚙️</button>
    </header>

    <nav class="page-nav" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button onclick="mudarPagina('inicio')">🏠</button>
      <button onclick="mudarPagina('vip')">⭐ VIP</button>
    </nav>

    <!-- PÁGINA INÍCIO -->
    <main id="pagina-inicio" class="page-content active-page">
      <h2>Bem-vindo à Turminha!</h2>
      <p>Explore, brinque e aprenda com a gente.</p>
    </main>

    <!-- PÁGINA VIP -->
    <main id="pagina-vip" class="page-content">
      <h2>Área VIP ⭐</h2>
      <div id="area-certificado" class="certificado-moldura">
        <p>Poste seu pequeno fã e marque a gente!</p>
        <div id="exibir-nome-certificado" class="certificado-nome-destaque">Nome</div>
        <button onclick="baixarDiplomaComoImagem()">Baixar Diploma</button>
      </div>
    </main>

    <section class="support-form-box" style="margin-top: 30px;">
      <h5>📬 Precisa de ajuda?</h5>
      <input type="email" id="suporteEmail" placeholder="Seu e-mail" style="width:100%; padding: 8px;">
      <textarea id="suporteMensagem" placeholder="Sua dúvida..." style="width:100%; padding: 8px; margin: 10px 0;"></textarea>
      <button onclick="enviarSuporteReclamacao()" class="support-btn">Enviar Mensagem</button>
    </section>
  </div>

  <script>
    // URL do seu Script Google
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxtV9X0CNAFK69n7JGLBKyPaXCFERg4L4Y-jFw96xj18vueORUGlRtBXOJeJtBboQki/exec";

    function mudarPagina(pagina) {
      document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
      document.getElementById('pagina-' + pagina).classList.add('active-page');
    }

    function enviarSuporteReclamacao() {
      const email = document.getElementById('suporteEmail').value.trim();
      const msg = document.getElementById('suporteMensagem').value.trim();
      
      fetch(URL_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, mensagem: msg, tipo: "SUPORTE" })
      })
      .then(() => alert("Enviado com sucesso!"))
      .catch(e => alert("Erro ao enviar."));
    }

    function gerarCertificado() {
      const nome = prompt("Qual o nome do pequeno fã?");
      if(nome) {
        document.getElementById('exibir-nome-certificado').innerText = nome;
        document.getElementById('area-certificado').style.display = 'block';
      }
    }
  </script>
</body>
</html>
