<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turminha do Xexéu - Portal Oficial</title>
  
  <link rel="icon" type="image/png" href="https://i.imgur.com/ANqcDjC.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #3B82F6; --primary-dark: #1D4ED8; --secondary: #F59E0B; --purple: #8B5CF6;
      --bg-gradient: linear-gradient(180deg, #E0F2FE 0%, #FAF5FF 60%, #FFF1F2 100%);
      --text-main: #0F172A; --text-muted: #475569; --radius-xl: 32px; --radius-lg: 20px; --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05); --shadow-lg: 0 18px 36px rgba(59, 130, 246, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 12px 12px 60px; }
    .app-container { width: 100%; max-width: 1120px; background: rgba(255, 255, 255, 0.96); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; gap: 24px; padding-bottom: 32px; border: 3px solid #FFFFFF; }
    header { padding: 16px 24px; background: linear-gradient(135deg, #BAE6FD 0%, #E0F2FE 100%); display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-lg); margin: 16px 16px 0; }
    .logo-img { max-width: 170px; height: auto; }
    
    /* Redes Sociais apenas da Turminha */
    .social-round-section { padding: 0 20px; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
    .social-round-btn { width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid #E2E8F0; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: var(--shadow-sm); }
    .social-round-btn:hover { transform: translateY(-3px); border-color: var(--primary); }
    .social-round-btn img { width: 30px; height: 30px; object-fit: contain; }

    /* Estilos dos outros elementos permanecem conforme sua estrutura anterior... */
    .page-nav { display: flex; justify-content: center; gap: 10px; background: #F0F9FF; padding: 8px; border-radius: var(--radius-lg); margin: 0 16px; border: 2px solid #BAE6FD; flex-wrap: wrap; }
    .nav-tab-btn { flex: 1; min-width: 110px; max-width: 200px; padding: 14px 10px; border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; background: transparent; color: var(--text-muted); }
    .nav-tab-btn.active { background: var(--primary); color: #FFF; }
    .page-content { display: none; flex-direction: column; gap: 28px; }
    .page-content.active-page { display: flex; }
    
    /* Botão VIP e Anúncios */
    .top-vip-announcement { margin: 0 16px -12px; background: #FEF3C7; border: 2px dashed #F59E0B; border-radius: var(--radius-md); padding: 10px; text-align: center; color: #92400E; font-weight: 800; cursor: pointer; }
    .floating-vip-badge { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #F59E0B, #D97706); color: #FFF; padding: 12px 20px; border-radius: 50px; font-weight: 800; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4); cursor: pointer; z-index: 9999; }
    
    /* Layout Jogos e VIP mantidos... */
  </style>
</head>
<body>

  <div class="floating-vip-badge" onclick="mudarPagina('vip')">⭐ Clube VIP (R$ 6,00)</div>

  <div class="app-container">
    <header>
      <img src="https://i.imgur.com/3lM9igy.png" alt="Logo Turminha do Xexéu" class="logo-img">
      <button id="toggleAudioBtn" class="audio-toggle-btn" onclick="alternarAudioGlobal()">🔊 Voz Ligada</button>
    </header>

    <nav class="page-nav">
      <button id="btn-tab-inicio" class="nav-tab-btn active" onclick="mudarPagina('inicio')">🏠 Início</button>
      <button id="btn-tab-videos" class="nav-tab-btn" onclick="mudarPagina('videos')">🎬 Vídeos</button>
      <button id="btn-tab-jogos" class="nav-tab-btn" onclick="mudarPagina('jogos')">🎮 Jogos</button>
      <button id="btn-tab-vip" class="nav-tab-btn vip-tab" onclick="mudarPagina('vip')">⭐ Área VIP</button>
    </nav>

    <div class="top-vip-announcement" onclick="mudarPagina('vip')">
      ⭐ Faça parte do Clube VIP da Turminha por apenas R$ 6,00/mês! 💖
    </div>

    <!-- Redes Sociais Filtradas -->
    <section class="social-round-section">
      <a href="https://www.youtube.com/@turminhaxe_xeu" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/rFW5M6l.png" alt="YouTube"></a>
      <a href="https://www.instagram.com/turminhaxe_xeu" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/yIbaMKH.png" alt="Instagram"></a>
      <a href="https://www.tiktok.com/@turminhaxe_xeu" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/iwSYwA7.png" alt="TikTok"></a>
      <a href="https://open.spotify.com/intl-pt/artist/6ykKQ3uP6Wl2REylKJAdJ6" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/9c2BiJo.png" alt="Spotify"></a>
      <a href="https://music.youtube.com/channel/UC8KOg4IH-h0YNrpKlfIl2Vw" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/mkgDBjM.png" alt="YouTube Music"></a>
      <a href="https://www.facebook.com/profile.php?id=61585431586796" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/viKEETj.png" alt="Facebook"></a>
      <a href="https://www.threads.net/@turminhaxe_xeu" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/3qJ8rYd.png" alt="Threads"></a>
      <a href="https://br.pinterest.com/turminhaxexeu/" target="_blank" class="social-round-btn"><img src="https://i.imgur.com/JkJ5AKT.png" alt="Pinterest"></a>
    </section>

    <!-- ... (restante do conteúdo: Pagina Inicio, Jogos, VIP, Scripts permanecem conforme a lógica anterior) ... -->
    
  </div>

  <script>
    // Seus scripts de lógica VIP e Jogos aqui...
    // Mantenha as funções carregarQuiz(), carregarJogoCor() etc, garantindo que elas usem a const TODOS_PERSONAGENS com os 12 membros.
  </script>
</body>
</html>
