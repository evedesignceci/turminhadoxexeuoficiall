<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Viewport com zoom habilitado para acessibilidade (WCAG) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turminha do Xexéu — Portal Oficial</title>
  
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563EB; 
      --primary-hover: #1D4ED8; 
      --secondary: #F59E0B; 
      --secondary-dark: #D97706;
      --accent: #EF4444; 
      --purple: #8B5CF6; 
      --pink: #EC4899; 
      --green: #10B981; 
      --green-dark: #059669;
      --tea-blue: #0284C7; 
      --bg-canvas: #F0F7FF; 
      --card-bg: #FFFFFF; 
      --text-main: #0F172A; 
      --text-muted: #475569;
      --border-color: #CBD5E1; 
      --radius-xl: 32px; 
      --radius-lg: 20px; 
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05); 
      --shadow-md: 0 10px 25px -3px rgba(37, 99, 235, 0.1);
      --shadow-3d: 0 5px 0px #CBD5E1; 
      --shadow-3d-primary: 0 5px 0px #1E40AF; 
      --shadow-3d-vip: 0 5px 0px #B45309;
      --shadow-3d-green: 0 5px 0px #047857; 
      --shadow-3d-pink: 0 5px 0px #BE185D;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Fredoka', 'Nunito', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background: var(--bg-canvas); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      user-select: none; 
      overflow-x: hidden; 
      transition: background-color 0.3s ease, color 0.3s ease; 
    }

    /* MODO SENSORIAL (TEA/Acolhimento) - Paleta suave sem borrões no texto */
    body.sensory-mode {
      --bg-canvas: #F5F2EB !important; 
      --card-bg: #FAF8F5 !important; 
      --primary: #4A6B82 !important;
      --primary-hover: #3D5A6C !important; 
      --secondary: #8C7355 !important; 
      --tea-blue: #4A6B82 !important;
      --purple: #695D75 !important; 
      --pink: #855C68 !important; 
      --green: #4D7364 !important;
      --accent: #874C4C !important; 
      --text-main: #242628 !important; 
      --text-muted: #575A5E !important;
      --border-color: #D6D0C4 !important; 
      --shadow-3d: 0 2px 0px #C7BFB1 !important;
      --shadow-md: 0 4px 10px rgba(0,0,0,0.03) !important;
    }

    body.sensory-mode *,
    @media (prefers-reduced-motion: reduce) {
      animation: none !important; 
      transition: none !important; 
    }

    body.sensory-mode .vip-floating-bar { 
      display: none !important; 
    }

    .app-shell { 
      width: 100%; 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 16px 20px 100px; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }
    
    header.game-header { 
      background: var(--card-bg); 
      padding: 12px 24px; 
      border-radius: var(--radius-xl); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      box-shadow: var(--shadow-md); 
      border: 3px solid var(--border-color); 
      gap: 16px; 
      flex-wrap: wrap; 
    }

    .logo-box { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      text-decoration: none; 
    }

    .logo-img { 
      height: 52px; 
      width: auto; 
      object-fit: contain; 
      transition: transform 0.3s; 
    }

    .logo-img:hover { 
      transform: scale(1.05) rotate(-2deg); 
    }

    .header-quick-stats { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: #FEF3C7; 
      border: 2px solid #F59E0B; 
      padding: 8px 18px; 
      border-radius: 50px; 
      font-weight: 800; 
      color: #78350F; 
      font-size: 15px; 
      position: relative; 
      overflow: hidden; 
    }

    .xp-bar-container { 
      position: absolute; 
      bottom: 0; 
      left: 0; 
      height: 5px; 
      background: #FDE68A; 
      width: 100%; 
    }

    .xp-bar-fill { 
      height: 100%; 
      background: #D97706; 
      width: 0%; 
      transition: width 0.4s ease-out; 
    }

    /* Target size acessível (mínimo 48px de altura) */
    .btn-tactile { 
      min-height: 48px;
      min-width: 48px;
      background: #FFFFFF; 
      border: 2px solid #CBD5E1; 
      box-shadow: var(--shadow-3d); 
      color: var(--text-main); 
      padding: 10px 20px; 
      border-radius: var(--radius-md); 
      font-weight: 700; 
      font-size: 15px; 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: transform 0.1s, box-shadow 0.1s; 
      text-decoration: none; 
    }

    .btn-tactile:active { 
      transform: translateY(4px); 
      box-shadow: 0 1px 0px #CBD5E1; 
    }

    .btn-tactile.primary { background: var(--primary); border-color: var(--primary-hover); color: #FFF; box-shadow: var(--shadow-3d-primary); }
    .btn-tactile.vip { background: linear-gradient(135deg, #F59E0B, #D97706); border-color: #B45309; color: #FFF; box-shadow: var(--shadow-3d-vip); }
    .btn-tactile.green { background: var(--green); border-color: var(--green-dark); color: #FFF; box-shadow: var(--shadow-3d-green); }
    .btn-tactile.pink { background: var(--pink); border-color: #BE185D; color: #FFF; box-shadow: var(--shadow-3d-pink); }
    .btn-icon-round { border-radius: 50%; padding: 0; font-size: 20px; }

    nav.main-nav { 
      display: flex; 
      gap: 10px; 
      background: #FFFFFF; 
      padding: 10px; 
      border-radius: var(--radius-lg); 
      border: 3px solid var(--border-color); 
      box-shadow: var(--shadow-sm); 
      overflow-x: auto; 
      scrollbar-width: none; 
      -webkit-overflow-scrolling: touch; 
    }
    nav.main-nav::-webkit-scrollbar { display: none; }

    .nav-item-btn { 
      flex: 1; 
      min-width: 120px; 
      min-height: 48px;
      padding: 10px 16px; 
      border: none; 
      background: transparent; 
      border-radius: var(--radius-md); 
      font-weight: 700; 
      font-size: 15px; 
      color: var(--text-muted); 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      transition: background-color 0.2s, color 0.2s; 
      white-space: nowrap; 
    }

    .nav-item-btn:hover { background: #F1F5F9; color: var(--primary); }
    .nav-item-btn.active { background: var(--primary); color: #FFFFFF; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }

    .page-box { display: none; flex-direction: column; gap: 20px; animation: slideUpFade 0.3s ease-out; }
    .page-box.active { display: flex; }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .app-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(15, 23, 42, 0.65); 
      backdrop-filter: blur(4px); 
      z-index: 9999; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    
    .app-modal.show { display: flex; animation: fadeIn 0.2s ease-out; }
    
    .modal-content { 
      background: #FFFFFF; 
      border-radius: var(--radius-xl); 
      padding: 32px 24px; 
      max-width: 440px; 
      width: 100%; 
      border: 4px solid var(--accent); 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
    }

    .form-input { 
      width: 100%; 
      min-height: 48px;
      padding: 12px 16px; 
      font-size: 16px; 
      border: 2px solid #CBD5E1; 
      border-radius: var(--radius-md); 
      font-weight: 700; 
      margin-bottom: 16px; 
      outline: none; 
      text-align: center; 
    }
    
    .form-input:focus { border-color: var(--primary); }
    
    #appToast { 
      position: fixed; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%) translateY(-120px); 
      background: #0F172A; 
      color: #FFF; 
      padding: 12px 24px; 
      border-radius: 50px; 
      font-weight: 700; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.2); 
      z-index: 99999; 
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
    }
    #appToast.active { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="appToast" role="alert" aria-live="polite">Mensagem do Portal</div>

  <!-- Modal com acessibilidade semântica -->
  <section id="modalTempoEsgotado" class="app-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-content">
      <span style="font-size: 48px; display: block;" aria-hidden="true">⏰</span>
      <h3 id="modalTitulo" style="color: var(--accent); font-size: 24px; font-weight: 800; margin: 12px 0 6px;">Hora de Fazer uma Pausa!</h3>
      <p style="font-size: 15px; color: var(--text-muted); margin-bottom: 20px;">O limite de tempo definido pela família foi atingido.</p>
      
      <label for="pinDesbloqueioTempo" class="sr-only" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);">Digite o PIN dos Pais</label>
      <input type="password" id="pinDesbloqueioTempo" class="form-input" placeholder="Digite o PIN dos Pais" inputmode="numeric" maxlength="6">
      
      <button type="button" class="btn-tactile primary" style="width: 100%;">Liberar Acesso</button>
    </div>
  </section>

</body>
</html>
