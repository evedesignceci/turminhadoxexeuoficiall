<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- CORREÇÃO DE VIEWPORT PARA NÃO ESPREMER -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turminha do Xexéu - Portal Oficial</title>
  
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cinzel:wght@700;900&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #3B82F6; --primary-dark: #1D4ED8; --secondary: #F59E0B; --accent: #EF4444;
      --purple: #8B5CF6; --green: #10B981; --tea-blue: #0284C7; --tea-light: #F0F9FF;
    }

    /* FIX MOBILE: Layout Fluido */
    body { background: linear-gradient(180deg, #E0F2FE 0%, #FAF5FF 100%); margin: 0; padding: 10px; min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 600px; background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; overflow-x: hidden; }

    header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .logo-img { max-width: 120px; }

    .page-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 0 10px; }
    .nav-tab-btn { padding: 8px 4px; border: none; border-radius: 10px; font-weight: 800; font-size: 10px; cursor: pointer; background: #EFF6FF; }
    .nav-tab-btn.active { background: var(--primary); color: #FFF; }

    .page-content { display: none; flex-direction: column; gap: 15px; padding: 0 15px; }
    .page-content.active-page { display: flex; }

    .floating-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .floating-char-card { background: #FFF; border-radius: 16px; padding: 10px; text-align: center; border: 2px solid #E2E8F0; }
    
    .btn-choice { background: var(--purple); color: #FFF; border: none; padding: 12px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; }
    
    .acalento-grid, .ninar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .acalento-btn, .ninar-btn { background: #FFF; border: 2px solid var(--tea-blue); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
    
    .vip-modal-backdrop { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 99999; justify-content:center; align-items:center; padding: 20px; }
    .vip-modal-backdrop.active { display: flex; }
    .vip-modal-box { background: #FFFBEB; padding: 25px; border-radius: 20px; text-align:center; max-width: 350px; }
    
    .certificado-moldura { background: #FFFDF7; border: 4px double #D97706; padding: 20px; text-align: center; margin-top: 10px; font-family: 'Cinzel', serif; }
  </style>
</head>
<body>

  <div id="modalConviteVip" class="vip-modal-backdrop">
    <div class="vip-modal-box">
      <h3>⭐ Recurso VIP</h3>
      <p>Este conteúdo é exclusivo. Seja VIP por R$ 6,00!</p>
      <button onclick="fecharModalVip(); mudarPagina('vip');" style="width:100%; padding:15px; border-radius:12px; background:var(--secondary); color:#FFF; border:none; font-weight:900; margin:15px 0;">Quero ser VIP!</button>
      <button onclick="fecharModalVip()" style="background:none; border:none; cursor:pointer;">Agora não</button>
    </div>
  </div>

  <div class="app-container">
    <header>
      <img src="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png" alt="Logo" class="logo-img">
      <button onclick="alternarAudioGlobal()">🔊</button>
    </header>

    <nav class="page-nav">
      <button class="nav-tab-btn active" onclick="mudarPagina('inicio')">🏠 Início</button>
      <button class="nav-tab-btn" onclick="mudarPagina('jogos')">🎮 Jogos</button>
      <button class="nav-tab-btn" onclick="mudarPagina('tea')">🧩 TEA</button>
      <button class="nav-tab-btn" onclick="mudarPagina('vip')">⭐ VIP</button>
    </nav>

    <main id="pagina-inicio" class="page-content active-page">
      <div style="background:#FDE68A; padding:10px; border-radius:10px; text-align:center; font-weight:800; cursor:pointer;" onclick="mudarPagina('vip')">
        ✨ Desbloqueie Drive, Jogos e Vozes por R$ 6,00! 💖
      </div>
    </main>

    <main id="pagina-jogos" class="page-content">
      <canvas id="paintCanvas" style="border: 2px solid var(--primary); border-radius: 12px; width: 100%; height: 250px;"></canvas>
      <button onclick="limparCanvas()" class="btn-choice">Limpar Lousa</button>
    </main>

    <main id="pagina-tea" class="page-content">
      <h3>🎧 Sons Relaxantes</h3>
      <div id="gridSonsAcalento" class="acalento-grid"></div>
      
      <h3>🌙 Músicas de Ninar</h3>
      <div id="gridMusicasNinar" class="ninar-grid"></div>

      <h3>💬 Cartão de Fala</h3>
      <div class="caa-grid" id="caaGrid"></div>
    </main>

    <main id="pagina-vip" class="page-content">
      <div id="vip-unlocked-view" style="display:none; text-align:center;">
        <h2>🎉 Você é VIP!</h2>
        <div id="certificado-resultado" class="certificado-moldura">
            <h3>Diploma de Super Fã</h3>
            <h1 id="exibir-nome-certificado">Nome</h1>
            <button onclick="baixarDiplomaComoImagem()" style="margin-top:10px; padding:10px;">📥 Baixar Diploma</button>
        </div>
      </div>
      <div id="vip-locked-view">
        <button onclick="ativarVip()" style="width:100%; padding:20px; background:var(--secondary); color:#FFF; border:none; border-radius:12px; font-weight:900;">Simular Ativação VIP</button>
      </div>
    </main>
  </div>

  <script>
    // --- LÓGICA CORE ---
    let somAcalentoAudio = null;
    let musicaNinarAudio = null;

    function verificarVip() {
      const isVip = localStorage.getItem('turminha_xexeu_vip_ativo') === 'true';
      if (isVip) {
        document.getElementById('vip-unlocked-view').style.display = 'block';
        document.getElementById('vip-locked-view').style.display = 'none';
      }
      renderizarSonsAcalento();
      renderizarMusicasNinar();
    }

    function ativarVip() {
      localStorage.setItem('turminha_xexeu_vip_ativo', 'true');
      alert("VIP ATIVADO!");
      location.reload();
    }

    function lerTexto(txt) { const u = new SpeechSynthesisUtterance(txt); window.speechSynthesis.speak(u); }
    function fecharModalVip() { document.getElementById('modalConviteVip').classList.remove('active'); }
    function mudarPagina(p) {
        document.querySelectorAll('.page-content').forEach(e => e.classList.remove('active-page'));
        document.getElementById('pagina-' + p).classList.add('active-page');
    }

    // --- SONS ---
    const LISTA_SONS_RELAXANTES = [
      { id: 'chuva', nome: 'Chuva', icon: '🌧️', url: 'https://cdn.freesound.org/previews/237/237729_4284968-lq.mp3', gratis: true },
      { id: 'mar', nome: 'Mar', icon: '🌊', url: 'https://cdn.freesound.org/previews/400/400632_5121236-lq.mp3', gratis: true },
      { id: 'passaros', nome: 'Pássaros', icon: '🐦', url: 'https://cdn.freesound.org/previews/416/416529_5121236-lq.mp3', gratis: false }
    ];

    const LISTA_MUSICAS_NINAR = [
      { id: 'ninar1', nome: 'Estrelinha', icon: '⭐', url: 'https://cdn.freesound.org/previews/608/608821_11861866-lq.mp3', gratis: true },
      { id: 'ninar2', nome: 'Dorme', icon: '🌙', url: 'https://cdn.freesound.org/previews/538/538786_11861866-lq.mp3', gratis: true },
      { id: 'ninar3', nome: 'Xexéu Ninar', icon: '🎶', url: 'https://cdn.freesound.org/previews/515/515822_11861866-lq.mp3', gratis: false }
    ];

    function renderizarSonsAcalento() {
        const grid = document.getElementById('gridSonsAcalento');
        const isVip = localStorage.getItem('turminha_xexeu_vip_ativo') === 'true';
        LISTA_SONS_RELAXANTES.forEach(s => {
            const btn = document.createElement('div');
            btn.className = 'acalento-btn';
            btn.innerHTML = `${!s.gratis && !isVip ? '<span class="acalento-badge-lock">⭐VIP</span>' : ''} <span>${s.icon}</span><p>${s.nome}</p>`;
            btn.onclick = () => { if(!s.gratis && !isVip) abrirModalVip(); else tocarSom(s, 'acalento'); };
            grid.appendChild(btn);
        });
    }

    function renderizarMusicasNinar() {
        const grid = document.getElementById('gridMusicasNinar');
        const isVip = localStorage.getItem('turminha_xexeu_vip_ativo') === 'true';
        LISTA_MUSICAS_NINAR.forEach(m => {
            const btn = document.createElement('div');
            btn.className = 'ninar-btn';
            btn.innerHTML = `${!m.gratis && !isVip ? '<span class="acalento-badge-lock">👑VIP</span>' : ''} <span>${m.icon}</span><p>${m.nome}</p>`;
            btn.onclick = () => { if(!m.gratis && !isVip) abrirModalVip(); else tocarSom(m, 'ninar'); };
            grid.appendChild(btn);
        });
    }

    function tocarSom(item, tipo) {
        if(tipo === 'acalento') {
            if(somAcalentoAudio) somAcalentoAudio.pause();
            somAcalentoAudio = new Audio(item.url); somAcalentoAudio.play();
        } else {
            if(musicaNinarAudio) musicaNinarAudio.pause();
            musicaNinarAudio = new Audio(item.url); musicaNinarAudio.play();
        }
    }

    function baixarDiplomaComoImagem() { alert("Diploma Gerado!"); }
    window.onload = () => { verificarVip(); renderizarSonsAcalento(); renderizarMusicasNinar(); };
  </script>
</body>
</html>
