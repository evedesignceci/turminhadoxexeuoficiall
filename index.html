<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Turminha do Xexéu - Portal Oficial</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/oactqmgs/image/upload/v1786908275/TURMINHA_LOGO.png">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cinzel:wght@700;900&family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ... COPIE AQUI TODO O SEU CSS ORIGINAL (Do :root até .cookie-banner) ... */
    /* Adicione estas classes ao fim do seu CSS para o novo layout: */
    .vip-input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #E2E8F0; border-radius: 12px; }
    .support-btn { background: #D97706; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; }
    .certificado-moldura { background: #FFFDF7; border: 6px double #D97706; border-radius: 16px; padding: 26px 20px; text-align: center; display: none; margin-top: 20px; }
    .certificado-nome-destaque { font-family: 'Cinzel', serif; font-size: 28px; color: var(--primary-dark); border-bottom: 3px solid #F59E0B; display: inline-block; margin: 16px 0; padding: 0 20px; }
  </style>
</head>
<body>
<!-- ... (CONTINUAÇÃO DO HTML - ABAIXO DO SEU CONTEÚDO ORIGINAL DE JOGOS E TEA) ... -->
    <main id="pagina-vip" class="page-content">
      <div class="age-group-section">
        <!-- (MANTENHA AQUI SEU CONTEÚDO VIP ORIGINAL) -->
        
        <!-- NOVA SEÇÃO: CERTIFICADO -->
        <div class="interactive-card" style="background:#FFF;">
          <h4 style="color:#92400E; font-weight:900; margin-bottom:12px;">🎓 Diploma de Super Fã</h4>
          <input type="text" id="nome-certificado" class="vip-input" placeholder="Nome da Criança">
          <button class="support-btn" style="background:#D97706;" onclick="gerarCertificado()">Gerar Diploma</button>
          
          <div id="certificado-resultado" class="certificado-moldura">
            <div class="certificado-titulo">Diploma de Super Fã</div>
            <div class="certificado-nome-destaque" id="exibir-nome-certificado">Nome</div>
            <p>é oficialmente um Super Fã da Turminha do Xexéu!</p>
            <button onclick="baixarDiplomaComoImagem()" style="margin-top:16px; padding:12px; background:#10B981; color:white; border:none; border-radius:10px;">Baixar Imagem</button>
          </div>
        </div>

        <!-- NOVA SEÇÃO: FORMULÁRIO -->
        <div class="support-form-box" style="margin-top:20px;">
          <h5>📬 Fale com a Turminha</h5>
          <select id="tipoMsg" class="vip-input">
            <option value="SUPORTE">Dúvidas/Questões</option>
            <option value="FEEDBACK">Feedback/Sugestão</option>
          </select>
          <input type="email" id="suporteEmail" class="vip-input" placeholder="Seu e-mail">
          <textarea id="suporteMensagem" class="vip-input" placeholder="Sua mensagem..."></textarea>
          <button class="support-btn" onclick="enviarSuporteReclamacao()">Enviar Mensagem</button>
        </div>
      </div>
    </main>
    <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxtV9X0CNAFK69n7JGLBKyPaXCFERg4L4Y-jFw96xj18vueORUGlRtBXOJeJtBboQki/exec";

    function gerarCertificado() {
      const nome = document.getElementById('nome-certificado').value.trim();
      if(!nome) return alert("Digite o nome!");
      document.getElementById('exibir-nome-certificado').innerText = nome;
      document.getElementById('certificado-resultado').style.display = 'block';
    }

    function enviarSuporteReclamacao() {
      const dados = {
        email: document.getElementById('suporteEmail').value,
        mensagem: document.getElementById('suporteMensagem').value,
        tipo: document.getElementById('tipoMsg').value
      };
      
      fetch(URL_SCRIPT, { 
        method: "POST", mode: "no-cors", headers: {"Content-Type": "application/json"}, body: JSON.stringify(dados) 
      })
      .then(() => { 
        alert("Enviado com sucesso!"); 
        document.getElementById('suporteMensagem').value = ''; 
      })
      .catch(() => alert("Erro ao enviar."));
    }

    function baixarDiplomaComoImagem() { alert("Dica: Tire um print para salvar!"); }
  </script>
</body>
</html>
